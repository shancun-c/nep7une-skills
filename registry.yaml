name: nep7une-skills
description: Personal AgentSkills collection maintained by nep7une.
repository: https://github.com/shancun-c/nep7une-skills
skills:
  - slug: obsidian-wiki-skill
    title: Obsidian Wiki Skill
    path: skills/obsidian-wiki-skill
    description: Maintain and evolve Obsidian-based knowledge vaults with orientation, ingest, answer, and audit workflows.
    dependencies:
      codex:
        required:
          - obsidian-markdown
          - obsidian-cli
          - obsidian-bases
          - json-canvas
        recommended:
          - defuddle
        optional:
          - anysearch
      hermes:
        required:
          - obsidian
        recommended:
          - obsidian-markdown
          - obsidian-cli
          - obsidian-bases
          - json-canvas
          - defuddle
        optional:
          - anysearch
      openclaw:
        required:
          - obsidian
        recommended:
          - defuddle
        optional:
          - obsidian-markdown
          - obsidian-cli
          - obsidian-bases
          - json-canvas
          - anysearch
    runtimes:
      codex:
        install_path: ~/.codex/skills/nep7une-skills/obsidian-wiki-skill
      hermes:
        install_path: ~/.hermes/skills/nep7une-skills/obsidian-wiki-skill
      openclaw:
        install_path: ./skills/nep7une-skills/obsidian-wiki-skill
  - slug: knowledge-canvas-sync
    title: Knowledge Canvas Sync
    path: skills/knowledge-canvas-sync
    description: Daily sync of Obsidian knowledge canvas — extract new knowledge from source notes, create/update knowledge notes, maintain the visual knowledge graph. Supports open-domain knowledge extraction across any topic.
    dependencies:
      codex:
        required:
          - obsidian-canvas-creator
          - obsidian-markdown
        recommended:
          - obsidian-wiki-skill
          - json-canvas
        optional:
          - defuddle
          - anysearch
      hermes:
        required:
          - obsidian-canvas-creator
          - obsidian
        recommended:
          - obsidian-markdown
          - obsidian-wiki-skill
          - json-canvas
        optional:
          - defuddle
          - anysearch
      openclaw:
        required:
          - obsidian-canvas-creator
        recommended:
          - obsidian-markdown
          - obsidian
          - json-canvas
        optional:
          - defuddle
          - anysearch
    runtimes:
      codex:
        install_path: ~/.codex/skills/nep7une-skills/knowledge-canvas-sync
      hermes:
        install_path: ~/.hermes/skills/nep7une-skills/knowledge-canvas-sync
      openclaw:
        install_path: ./skills/nep7une-skills/knowledge-canvas-sync
  - slug: server-ops-skill
    title: Server Ops Skill
    path: skills/server-ops-skill
    description: Safely operate SSH-accessible Linux servers with orientation, inspection, deployment, repair, rollback, and hardening workflows.
    dependencies:
      codex:
        required: []
        recommended: []
        optional: []
      hermes:
        required: []
        recommended: []
        optional: []
      openclaw:
        required: []
        recommended: []
        optional: []
    tools:
      required:
        - ssh
      recommended:
        - rsync
        - scp
        - ssh-keygen
    runtimes:
      codex:
        install_path: ~/.codex/skills/nep7une-skills/server-ops-skill
      hermes:
        install_path: ~/.hermes/skills/nep7une-skills/server-ops-skill
      openclaw:
        install_path: ./skills/nep7une-skills/server-ops-skill
